version: "3.8"

x-airflow-common: &airflow-common
  # image: apache/airflow:2.8.1-python3.11
  build: .
  environment: &airflow-common-env
    # AIRFLOW__CORE__FERNET_KEY: ""

    AIRFLOW__CORE__FERNET_KEY: '46G2d3z9x0A='  # Hoặc chuỗi Fernet Key cố định của bạn
    AIRFLOW__WEBSERVER__SECRET_KEY: 'retail_data_pipeline_secret_key_2026' # <--- THÊM DÒNG NÀY

    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_dwh:5432/airflow_db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__LOGGING_LEVEL: INFO
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled" # <--- BẬT CHO PHÉP TEST CONNECTION

    # Biến môi trường kết nối DB
    MYSQL_HOST: mysql_source
    MYSQL_PORT: 3306
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    MYSQL_DB: ${MYSQL_DB}
    POSTGRES_HOST: postgres_dwh
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./requirements.txt:/opt/airflow/requirements.txt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres_dwh:
      condition: service_healthy

services:
  # ============================================================
  # 1. MYSQL CONTAINER (Source System)
  # ============================================================
  mysql_source:
    image: mysql:8.0
    container_name: retail_mysql_source
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./sql/00_init_mysql_source.sql:/docker-entrypoint-initdb.d/00_init_mysql_source.sql
      - mysql_source_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. POSTGRESQL CONTAINER (Data Warehouse & Airflow Metadata)
  # ============================================================
  postgres_dwh:
    image: postgres:16-alpine
    container_name: retail_postgres_dwh
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      # Tự động tạo DB cho Airflow Metadata
      - ./sql/00_init_airflow_db.sql:/docker-entrypoint-initdb.d/00_init_airflow_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 3. AIRFLOW INIT (Khởi tạo DB & Admin User)
  # ============================================================
  airflow-init:
    <<: *airflow-common
    container_name: retail_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/requirements.txt
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Nhat \
          --lastname Huy \
          --role Admin \
          --email admin@retail.com
    restart: on-failure

  # ============================================================
  # 4. AIRFLOW WEBSERVER (UI: http://localhost:8080)
  # ============================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: retail_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================================
  # 5. AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: retail_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  mysql_source_data:
  postgres_dwh_data:
